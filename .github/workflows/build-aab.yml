name: Build Android AAB (target API 36)

# Builds the Trusted Web Activity wrapper for worker.thekaamready.in as a signed
# Android App Bundle targeting Android 16 / API 36, ready to upload to Play.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  - base64 of SIGNING_KEY_worker/signing.keystore
#   ANDROID_KEYSTORE_PASSWORD - the keystore password (also used as the key password)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Play versionCode (must be higher than anything already uploaded)"
        required: true
        default: "1"
      versionName:
        description: "versionName shown to users"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36 + build-tools 36.1.0
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Point Bubblewrap at the runner's JDK and SDK
        run: |
          set -e
          # Bubblewrap expects <sdk>/bin/sdkmanager or <sdk>/tools/bin/sdkmanager
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin" \
              || sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" \
            > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          grep -m1 JAVA_VERSION "$JAVA_HOME/release"

      - name: Install Bubblewrap CLI 1.25.0
        run: |
          npm install -g @bubblewrap/cli@1.25.0
          bubblewrap --version

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/signing.keystore
          ls -l android/signing.keystore

      - name: Apply version from workflow inputs
        working-directory: android
        run: |
          set -e
          jq --argjson vc "${{ github.event.inputs.versionCode }}" \
             --arg     vn "${{ github.event.inputs.versionName }}" \
             '.appVersionCode = $vc | .appVersion = $vn' \
             twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json
          cat twa-manifest.json

      - name: Generate Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Assert targetSdkVersion 36
        working-directory: android
        run: |
          set -e
          grep -E "compileSdkVersion +36" app/build.gradle
          grep -E "targetSdkVersion +36"  app/build.gradle
          echo "OK: compileSdk and targetSdk are 36"
          if grep -qE "screenOrientation|resizableActivity=\"false\"" app/src/main/AndroidManifest.xml; then
            echo "::error::AndroidManifest still contains an orientation / resizable restriction."
            grep -nE "screenOrientation|resizableActivity" app/src/main/AndroidManifest.xml
            exit 1
          fi
          echo "OK: no orientation or large-screen restriction"
          # A trusted origin written with a scheme yields "https://https://host" and an
          # invalid android:host, which breaks Android App Links verification for ALL
          # hosts in the app - the TWA then opens with a browser URL bar visible.
          if grep -rq "https://https://" app/src/main/res/ app/src/main/AndroidManifest.xml; then
            echo "::error::Malformed trusted origin (https://https://). Use a bare host in additionalTrustedOrigins."
            grep -rn "https://https://" app/src/main/res/ app/src/main/AndroidManifest.xml
            exit 1
          fi
          echo "OK: trusted origins well-formed"

      - name: Build and sign
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Print signing certificate
        working-directory: android
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          "$APKSIGNER" verify --print-certs app-release-signed.apk | grep -i "SHA-256" || true
          echo "--- bundle contents check ---"
          ls -lh app-release-bundle.aab app-release-signed.apk

      - name: Upload the App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaam-ready-worker-aab-v${{ github.event.inputs.versionCode }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f android/signing.keystore
